[workspace]
members = [
    "crates/kairos-core",
    "crates/kairos-ui",
    "crates/kairos-platform",
    "crates/kairos-app",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["NovaOS Enterprise Team <engineering@novaos.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/firoze-hossain/kairos.git"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
